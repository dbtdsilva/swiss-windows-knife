[project]
name = "swiss-windows-knife"
version = "1.15.0"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Diogo Silva", email = "dbtdsilva@gmail.com" }]
dependencies = [
    "monitorcontrol==3.1.0",
    "pyside6==6.9.1",
    "pysolar==0.13",
    "pytz==2024.1",
    "pywin32==311",
    "wmi==1.5.1",
    "requests==2.32.4",
    "paho.mqtt==2.1.0",
    "psutil==7.2.2",
    "timezonefinder==8.2.2",
]

[project.optional-dependencies]
build = ["cx_Freeze==8.6.4"]
test = ["pytest>=8", "pytest-qt>=4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 127
target-version = "py312"
extend-exclude = ["src/resources.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "C90",    # mccabe complexity
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.semantic_release]
commit_message = "chore: updates version references to {version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "angular"
logging_use_named_masks = true
tag_format = "{version}"
major_on_zero = true
version_variables = ["src/app_info.py:__version__"]
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.branches.main]
match = "main"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
default_bump_level = 0

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = true
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = true

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false
insecure = false
